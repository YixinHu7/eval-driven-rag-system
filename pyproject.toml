[project]
name = "eval-driven-rag-system"
version = "0.1.0"
description = "An evaluation-driven RAG system for technical documentation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pyyaml>=6.0.2",
    "sqlalchemy>=2.0.35",
    "sentence-transformers>=3.0.1",
    "lancedb>=0.17.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "markdownify>=0.13.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "black>=24.8.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"